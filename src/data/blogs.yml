- slug: "202308150001"
  title: "C102参戦記 本編（上）"
  pubDate: "2023-08-15"
  updateDate: "2025-01-12"
  description: "私はC102にて、2日ともにコスプレ売り子として参加しました。今までもコスプレ売り子の経験はあったのですが、今回はそれ以上に気合を入れて準備をしてきました。開催前日の情報公開でみなさんにびっくりしてほしいという気持ちがあり、ほとんどTwitterには書いてこなかった情報もあります。みなさんにもあらためて驚いてもらえたらいいなぁと思っています。今回の衣装はアルバイト先のカフェの制服を着たマンハッタンカフェさんです。ゲーム「ウマ娘 プリティーダービー」では、サポートカードとして1枚絵だけが公開されています。比較的マイナーな衣装で、ウマ娘を追っていないと知らない人も多いかと思います…"
